name: Release APK
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk vinyl-${{ github.event.release.tag_name }}.apk
      - run: gh release upload "${{ github.event.release.tag_name }}" vinyl-*.apk
        env: { GH_TOKEN: '${{ github.token }}' }
