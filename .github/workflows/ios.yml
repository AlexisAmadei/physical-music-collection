name: iOS
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Xcode 27 image (public preview): same Xcode and iOS simulator the app is developed with.
    # The stable macos-26 image stops at Xcode 26.6 / iOS 26.5 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version
      # No Secrets.xcconfig in CI: it is an optional include, and the tests never call the network.
      - name: Build and test
        run: |
          xcodebuild test -project Vinyl.xcodeproj -scheme Vinyl \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2' \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/Tests.xcresult
          retention-days: 7
